<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>pagina</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="cont1">
        <h1>Calculadora de Promedio</h1>
        <p>Ingrese las tres notas del corte para calcular el promedio.</p>

        <label>Nota 1:</label>
        <input type="number" id="inputNota1" step="0.1">

        <label>Nota 2:</label>
        <input type="number" id="inputNota2" step="0.1">

        <label>Nota 3:</label>
        <input type="number" id="inputNota3" step="0.1">

        <button onclick="calc()">Calcular</button>

        <p id="resultadoPromedio"></p>
        <p id="resultadoEstado"></p>
    </div>

<script>

let data1 = [];
let promedio = 0;
const CANTIDAD_NOTAS = 3;

function calc() {

    let nota1 = parseFloat(document.getElementById("inputNota1").value);
    let nota2 = parseFloat(document.getElementById("inputNota2").value);
    let nota3 = parseFloat(document.getElementById("inputNota3").value);

    console.log("valores capturados:", nota1, nota2, nota3);

    if (isNaN(nota1) || isNaN(nota2) || isNaN(nota3)) {
        document.getElementById("resultadoPromedio").innerHTML = "Debe ingresar las tres notas.";
        return;
    }

    promedio = (nota1 + nota2 + nota3) / CANTIDAD_NOTAS;

    document.getElementById("resultadoPromedio").innerHTML = "Promedio: " + promedio.toFixed(2);

    if (promedio >= 3.0) {
        document.getElementById("resultadoEstado").innerHTML = "Resultado: aprobado";
    } else {
        document.getElementById("resultadoEstado").innerHTML = "Resultado: reprobado";
    }

    console.log("promedio calculado");
}

console.log("pagina cargada");

</script>

</body>
</html>
